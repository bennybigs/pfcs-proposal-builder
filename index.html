<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E8930C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PFCS Proposals" />
    <meta
      name="description"
      content="Build, share, and export Post-Frame Construction Solutions customer proposals."
    />
    <title>PFCS Proposal Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Big+Shoulders+Display:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Chrome/Edge fire beforeinstallprompt before React mounts, and the event
      // only fires once — capture it here so the Install button can use it.
      window.__pfcsInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pfcsInstallPrompt = e;
        window.dispatchEvent(new Event('pfcs-installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pfcsInstallPrompt = null;
        window.dispatchEvent(new Event('pfcs-installed'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
