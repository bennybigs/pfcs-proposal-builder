<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8930C"/>
      <stop offset="1" stop-color="#F7B733"/>
    </linearGradient>
    <linearGradient id="amberSwoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E8930C"/>
      <stop offset="1" stop-color="#F7B733"/>
    </linearGradient>
  </defs>

  <!-- Faceted mountain -->
  <path d="M60 6 L118 96 L2 96 Z" fill="#8A8A8A"/>
  <path d="M60 6 L118 96 L60 96 Z" fill="#6B6B6B"/>
  <path d="M60 6 L74 28 L60 40 L46 28 Z" fill="#5A5A5A"/>

  <!-- Truss gables (cutout style) -->
  <g stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linejoin="round">
    <path d="M20 96 L46 58 L72 96"/>
    <path d="M46 58 L46 96 M33 77 L59 77"/>
    <path d="M62 96 L90 52 L117 96"/>
    <path d="M90 52 L90 96 M76 74 L104 74"/>
  </g>

  <!-- Golden swoosh -->
  <path d="M2 88 C 40 106, 90 102, 122 62 C 100 92, 52 100, 2 92 Z" fill="url(#amberSwoosh)"/>
  <path d="M14 97 C 55 108, 100 98, 121 70 C 104 96, 60 106, 14 100 Z" fill="url(#amberSwoosh)" opacity="0.85"/>

  <!-- Wordmark -->
  <text x="140" y="50" font-family="'Big Shoulders Display','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="44" letter-spacing="1" fill="#1A1A1A">POST-FRAME</text>
  <text x="140" y="86" font-family="'Big Shoulders Display','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="33" letter-spacing="1.5" fill="url(#amber)">CONSTRUCTION</text>
  <text x="141" y="110" font-family="Barlow,Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="7.5" fill="#1A1A1A">SOLUTIONS</text>
</svg>
